name: scout-ci-watcher

# Phase 4 deliverable. Watches CI runs of the `checks` workflow and
# files a ribo:bug Issue when a test newly fails or has been flaky 3
# of the last 10 runs. Dedupes by ribo:ci-watcher label.
#
# Cadence: after every `checks` run on main completes + nightly at 02:00 UTC.
# Model: claude-haiku-4-5 (mechanical work; parsing run history).
#
# Trigger note: `anthropics/claude-code-action@v1` rejects `on: push:` with
# "Unsupported event type: push" (see docs: agent-mode supports
# workflow_dispatch, repository_dispatch, schedule, workflow_run). The
# `workflow_run` trigger fires after CI completes, which is when the run
# data this scout consumes actually exists; using push would fire too early.

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read
  actions: read
  id-token: write # required by anthropics/claude-code-action@v1 even with anthropic_api_key set

# One scout run at a time per scout type; queue rather than cancel.
concurrency:
  group: scout-ci-watcher
  cancel-in-progress: false

jobs:
  ci-watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "claude[bot],claude" # workflow_run/cron-initiated (bot actor); see ADR-0003
          prompt: "/ci-watcher repo=${{ github.repository }} run_id=${{ github.run_id }}"
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(gh:*),Bash(jq:*),Bash(date:*)"
