name: Ribosome

# Triggers:
#   - Issue labeled with ribo:feature, ribo:bug, or ribo:tweak -> start a chain.
#   - Issue labeled with ribo:project -> run the planner (decompose).
#   - Issue comment containing one of the six slash commands -> advance the chain.
#   - Issue closed (a chain slice) -> project auto-advance check. When a project
#     slice closes (its PR merged, which closes the linked Issue as "completed"),
#     the coordinator starts the next queued slice. The operator merging the PR
#     is gate 3; that merge is also the green light for the next slice, so
#     auto-advance adds no new gate. See ADR-0004.
#
# State machine: stored in a sticky comment on the Issue. The coordinator skill
# reads prior bot comments for an HTML-comment-bracketed JSON payload to know
# which step ran last. See OPERATOR.md for the operator view and
# .claude/skills/coordinator/SKILL.md for the workflow's view.
#
# Each event runs ONE action invocation. The action does as much chain work as
# fits in --max-turns; long builder runs may need multiple events to complete.
# Mid-run state lives in the ribosome/<id> feature branch once it exists.

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Prevent overlapping runs on the same Issue. The chain is sequential per
# Issue; parallel events would race on the state comment.
concurrency:
  group: ribosome-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ribosome:
    name: Ribosome chain step
    if: |
      (
        github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        (
          contains(github.event.label.name, 'ribo:feature') ||
          contains(github.event.label.name, 'ribo:bug') ||
          contains(github.event.label.name, 'ribo:tweak') ||
          contains(github.event.label.name, 'ribo:project')
        )
      )
      ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'closed' &&
        (
          contains(github.event.issue.labels.*.name, 'ribo:feature') ||
          contains(github.event.issue.labels.*.name, 'ribo:bug') ||
          contains(github.event.issue.labels.*.name, 'ribo:tweak')
        )
      )
      ||
      (
        github.event_name == 'issue_comment' &&
        (
          startsWith(github.event.comment.body, '/approve') ||
          startsWith(github.event.comment.body, '/changes') ||
          startsWith(github.event.comment.body, '/cancel') ||
          startsWith(github.event.comment.body, '/explain') ||
          startsWith(github.event.comment.body, '/keep') ||
          startsWith(github.event.comment.body, '/forget')
        ) &&
        github.event.comment.user.type != 'Bot'
      )
    runs-on: ubuntu-latest
    # 60 minutes is the upper bound. A normal chain step (researcher +
    # story-writer + post comment) completes in 5 to 15 min on opus.
    # The first observed real run hit 30 min and was killed; opening
    # the budget rather than the work surface so we can see what the
    # action actually does end to end.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the default GITHUB_TOKEN's identity for branch ops by the
          # checkout itself; the action below pushes via its own token.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Claude Code hook path
        run: git config core.hooksPath .claude/hooks

      - name: Configure git identity for bot commits
        run: |
          git config user.name "ribosome-bot"
          git config user.email "ribosome-bot@users.noreply.github.com"

      - name: Run Ribosome chain (Claude Code Action)
        uses: anthropics/claude-code-action@v1
        with:
          # Dual-auth: action picks whichever secret is populated. Default
          # is OAuth (Pro/Max subscription quota; zero incremental spend).
          # If the operator chose --auth api at /setup, ANTHROPIC_API_KEY
          # will be set and CLAUDE_CODE_OAUTH_TOKEN will be empty (and
          # vice versa). The action treats empty as unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: "true"
          # Allow the Claude App bot to initiate runs. The planner (running as
          # claude[bot]) labels the first child slice ribo:feature to auto-start
          # its chain; that label event is bot-initiated, and the action blocks
          # bot actors by default (allowed_bots=""), which silently stalls the
          # auto-start. Earned 2026-05-30 from the first live Project run: the
          # label fired the workflow, but the action self-aborted on the bot
          # check ("Workflow initiated by non-human actor: claude"). NOT "*":
          # the action docs warn that on a public repo "*" lets external Apps
          # invoke the action with their own prompts. List the Claude bot
          # explicitly, both forms, since the actor has shown as "claude".
          allowed_bots: "claude[bot],claude"
          # The coordinator skill is the entry point. It reads the Issue
          # context, locates the state comment, picks the next chain step,
          # spawns subagents, posts the next comment, and updates the state.
          # The skill body lives at .claude/skills/coordinator/SKILL.md.
          prompt: |
            /coordinator event=${{ github.event_name }} action=${{ github.event.action }} issue=${{ github.event.issue.number }} repo=${{ github.repository }} actor=${{ github.actor }} label=${{ github.event.label.name }} state_reason=${{ github.event.issue.state_reason }} command=${{ github.event.comment.body }} comment_id=${{ github.event.comment.id }} run_id=${{ github.run_id }}
          claude_args: |
            --model claude-opus-4-8
            --effort xhigh
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(node:*),Bash(jq:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(sed:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(echo:*),Bash(printf:*),Bash(date:*),Bash(sleep:*),Bash(true)"
            --append-system-prompt "You are running inside a GitHub Actions invocation triggered by event ${{ github.event_name }} on issue #${{ github.event.issue.number }} in ${{ github.repository }}. Read the operator-facing OPERATOR.md before any user-visible output. Post Issue comments with `gh issue comment`. Open draft PRs with `gh pr create --draft`. The chain state is encoded as a sticky HTML-comment-bracketed JSON in a bot comment on this Issue; if no such comment exists this is the first step. CRITICAL: advance the chain by exactly ONE gate transition per invocation, then STOP. Never run ahead of a PENDING human gate, but DO run through a gate that is skipped or auto-advanced (a tweak, or an auto-approved spec), because no operator event will arrive to resume you. By case: (a) labeled ribo:feature or ribo:bug: run researcher and story-writer, post the story comment with the state marker, then STOP; do not run spec-writer or builder, wait for /approve. (b) labeled ribo:tweak: follow the coordinator tweak fast-path with no story or spec gate; if the triage escalates it (oversized or sensitive) post the story for gate 1 and STOP, otherwise carry it through builder, verify-contracts, validator and open the draft PR in THIS invocation, then STOP. (c) /approve at the story gate (current_step story-writer): run spec-writer and the spec-gate triage; if it needs the operator post 'Spec for review (gate 2)' and STOP, otherwise record the spec auto-approved, post the one-line notice, and carry the chain through builder, verify-contracts, validator and the draft PR in THIS invocation, then STOP. (d) /approve at the spec gate (current_step spec-writer): carry through builder, verify-contracts, validator and the draft PR, then STOP. (e) /changes, /cancel, /explain, /keep, /forget: follow the matching dispatch row, then STOP. (f) issues 'closed' event: project auto-advance check per the coordinator's slice-closed dispatch row (start the next queued slice, pause the roadmap, or no-op if the closed Issue is not part of a project), then STOP. In every case, rebuild the Mission Control (ribo:in-flight) board as the last action before stopping, with the single command 'node --experimental-strip-types scripts/mission-control.ts --upsert' (it gathers via gh, renders, and edits the board itself; do not pipe or redirect to a file, that is blocked in the sandbox)."

      # No explicit "push" step here: the Claude Code action drives all git
      # operations (commit, push, branch creation, PR open) via gh + git
      # under the GitHub App's identity using the permissions above.
