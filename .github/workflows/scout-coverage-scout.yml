name: scout-coverage-scout

# Phase 4 deliverable. After each merge to main, if the merged change
# touched files with coverage below threshold, opens a ribo:bug Issue.
# Currently no coverage provider is wired; the scout no-ops cleanly in
# that case (per its skill body).
#
# Cadence: after every `checks` run on main completes.
# Model: claude-haiku-4-5 (parses coverage output).
#
# Trigger note: `anthropics/claude-code-action@v1` rejects `on: push:`
# (agent-mode supports workflow_dispatch, repository_dispatch, schedule,
# workflow_run). `workflow_run` also matches design intent better:
# coverage is only emitted after tests run, so firing on push would race
# the test job.

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read
  id-token: write # required by anthropics/claude-code-action@v1 even with anthropic_api_key set

concurrency:
  group: scout-coverage-scout
  cancel-in-progress: false

jobs:
  coverage-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, GITHUB_SHA defaults to default-branch HEAD (per
          # GitHub docs). For coverage diffs we want the exact SHA CI ran
          # against, so check that out explicitly. workflow_dispatch falls
          # back to the default github.sha.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2 # need previous commit to diff file list
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/coverage-scout repo=${{ github.repository }} sha=${{ github.event.workflow_run.head_sha || github.sha }}"
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(gh:*),Bash(jq:*),Bash(git:*),Bash(npm:*),Bash(date:*)"
